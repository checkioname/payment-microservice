syntax = "proto3";
option go_package = "invoice/";

package invoice;

service Invoicer {
  rpc GetInvoice (InvoiceRequest) returns (InvoiceResponse);
}

message InvoiceRequest {
  int32 order_id = 1;
  float price = 2;
}
message InvoiceResponse {
  int32 order_id = 1;
  bool success = 2;
  string message = 3;
}

