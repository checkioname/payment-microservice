syntax = "proto3";
option go_package = "payment/";

package payment;

service Payer {
  rpc ProcessPayment (PaymentRequest) returns (PaymentResponse);
}

message PaymentRequest {
  int32 order_id = 1;
  float price = 2;
}
message PaymentResponse {
  int32 order_id = 1;
  bool success = 2;
  string message = 3;
}

