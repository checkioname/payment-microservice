---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: lucas10sh/payment-service:latest
          imagePullPolicy: Always
          ports:
                - containerPort: 8008
                - containerPort: 8082
          env:
            - name: OTLP_ENDPOINT
              value: "tempo.monitoring:4318"
            - name: DATABASE_URL
              value: "postgres://postgres:devops123@host.docker.internal:5432/postgres?sslmode=disable"

              